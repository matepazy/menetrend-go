<style>/* LEAFLET_CSS */
html,body,#map{height:100%;margin:0;background:#e5edf3;font-family:Roboto,Arial,sans-serif}.leaflet-tile-pane{pointer-events:none}.hit{width:48px;height:48px;display:flex;align-items:center;justify-content:center}.cluster{background:#244c86;color:white;border:3px solid white;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font:bold 13px Roboto,Arial;box-shadow:0 2px 8px #1234}.vehicle.compact{width:28px;height:28px;min-width:0;padding:0;border-radius:50%}.vehicle svg{width:20px;height:20px;flex-shrink:0}.vehicle{display:flex;align-items:center;justify-content:center;gap:5px}.vehicle{flex-shrink:0;width:max-content;background:#2864d9;color:white;border:2px solid white;border-radius:22px;padding:6px 10px;white-space:nowrap;font:bold 13px Roboto,Arial;box-shadow:0 2px 8px #1234;min-width:20px;text-align:center}.bus{background:#0d687a}#status{position:absolute;z-index:1000;bottom:36px;left:12px;right:78px;background:#f8fbfff2;color:#112d43;border-radius:18px;padding:10px;font-size:12px;display:none}.leaflet-control-attribution{font-size:10px!important;max-width:240px;white-space:normal;margin-right:18px!important;margin-bottom:calc(var(--bottom-inset,0px) + 12px)!important;border-radius:12px;padding:4px 8px!important}.leaflet-tooltip{border-radius:16px;padding:10px}
.hit{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.vehicle.compact{position:relative}.vehicle.directed{background:transparent!important;border-color:transparent;box-shadow:none}.vehicle .heading{position:absolute;width:48px;height:48px;overflow:visible;filter:drop-shadow(0 2px 4px #1234)}.vehicle.directed>svg:last-child{position:relative}

</style></head><body><div id="map" role="application" aria-label="Járművek térképe"></div><div id="status"></div><script>/* LEAFLET_JS */</script><script>
L.Map.TouchZoom.prototype._onTouchEnd=function(){

 L.DomEvent.off(document,'touchmove',this._onTouchMove,this);

 this._map._move(this._center,z);this._map.fire('zoom');this._map._moveEnd(true);
};
const map=L.map('map',{zoomControl:false,doubleClickZoom:false,zoomSnap:0,bounceAtZoomLimits:false}).setView([47.17,19.5],7);
(()=>{
 const el=map.getContainer(),doubleTapMs=300,doubleTapSlop=48,tapSlop=12,swipeSlop=6,pxPerZoom=140;
 let lastTapTime=0,lastTapPt=null,downTime=0,downPt=null,tapMoved=false,doubleTap=false,swiping=false,startZoom=0,startCenter=null,targetZoom=0,frame=0,lastTouchEnd=0;
 function endSwipe(){
  if(frame){cancelAnimationFrame(frame);frame=0}
  if(swiping){swiping=false;map._move(startCenter,targetZoom);map.fire('zoom');map._moveEnd(true)}
  doubleTap=false;
 }
 el.addEventListener('touchstart',e=>{
  if(e.touches.length!==1){endSwipe();tapMoved=true;lastTapTime=0;return}
  if(e.target.closest&&e.target.closest('.hit,.leaflet-control')){lastTapTime=0;doubleTap=false;return}
  const pt=map.mouseEventToContainerPoint(e.touches[0]),now=Date.now();
  downPt=pt;downTime=now;tapMoved=false;swiping=false;
  if(lastTapPt&&now-lastTapTime<=doubleTapMs&&pt.distanceTo(lastTapPt)<=doubleTapSlop){
   doubleTap=true;lastTapTime=0;lastTapPt=null;
   map._stop();map.dragging?._draggable?.finishDrag(true);
  }else doubleTap=false;
 },{passive:true});
 el.addEventListener('touchmove',e=>{
  if(e.touches.length!==1){endSwipe();tapMoved=true;return}
  const pt=map.mouseEventToContainerPoint(e.touches[0]);
  if(!doubleTap){if(downPt&&pt.distanceTo(downPt)>tapSlop)tapMoved=true;return}
  if(!swiping){
   if(Math.abs(pt.y-downPt.y)<=swipeSlop&&pt.distanceTo(downPt)<=tapSlop)return;
   swiping=true;startZoom=targetZoom=map.getZoom();startCenter=map.getCenter();downPt=pt;
   map._moveStart(true,false);
  }
  if(e.cancelable)e.preventDefault();
  targetZoom=map._limitZoom(startZoom+(pt.y-downPt.y)/pxPerZoom);
  if(!frame)frame=requestAnimationFrame(()=>{frame=0;if(swiping)map._move(startCenter,targetZoom,{pinch:true,round:false})});
 },{passive:false});
 function onTouchEnd(e){
  lastTouchEnd=Date.now();
  if(doubleTap){
   if(e.cancelable)e.preventDefault();
   if(swiping)endSwipe();
   else{doubleTap=false;if(e.type==='touchend'&&downPt)map.setZoomAround(downPt,map._limitZoom(map.getZoom()+1))}
   return;
  }
  if(e.type==='touchend'&&!tapMoved&&downPt&&lastTouchEnd-downTime<=doubleTapMs){lastTapTime=lastTouchEnd;lastTapPt=downPt}
  else{lastTapTime=0;lastTapPt=null}
 }
 el.addEventListener('touchend',onTouchEnd,{passive:false});
 el.addEventListener('touchcancel',onTouchEnd,{passive:false});
 map.on('dblclick',e=>{if(Date.now()-lastTouchEnd>500)map.setZoomAround(e.containerPoint,map._limitZoom(map.getZoom()+1))});
})();
const status=document.getElementById('status');let tileFailed=false;
const osmAttribution='© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> közreműködők';
const imageryAttribution='<a href="https://www.esri.com/">Esri</a>, Maxar, Earthstar Geographics, GIS User Community';
const imagery='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
let mapLayers=[],mapTypeKey='',activeMapType='standard';
window.setMapType=(type,customUrl='')=>{
 if(!['standard','satellite','hybrid','rail','custom'].includes(type))type='standard';
 if(type==='custom'){
  try{
   const u=new URL(customUrl.replace(/\{[zxysr]\}/g,'1'));
   if(u.protocol!=='https:'||u.username||u.password||u.hash||/[\s\x00-\x1f]/.test(customUrl)||!['{z}','{x}','{y}'].every(k=>customUrl.includes(k)))type='standard';
  }catch(e){type='standard'}
 }
 const key=type+(type==='custom'?customUrl:'');if(key===mapTypeKey)return;
 mapLayers.forEach(layer=>map.removeLayer(layer));mapLayers=[];mapTypeKey=key;activeMapType=type;
 tileFailed=false;status.textContent='';status.style.display='none';
 function add(url,attribution,zIndex){
  const layer=L.tileLayer(url,{maxZoom:19,maxNativeZoom:19,attribution,zIndex,referrerPolicy:'no-referrer'});
  let failed=false;
  layer.on('loading',()=>{failed=false}).on('tileerror',()=>{
   if(!map.hasLayer(layer))return;failed=true;tileFailed=true;
   status.textContent='A térképcsempék nem tölthetők be. Ellenőrizd a kapcsolatot vagy válassz másik térképtípust.';status.style.display='block';
  }).on('load',()=>{
   if(!map.hasLayer(layer))return;
   layer.tileFailed=failed;
   tileFailed=mapLayers.some(l=>l.tileFailed);
   if(!tileFailed){status.textContent='';status.style.display='none'}
  });
  mapLayers.push(layer);layer.addTo(map);
 }
 if(type==='custom')add(customUrl,'Saját csempeforrás',1);
 else if(type==='satellite'||type==='hybrid'){
  add(imagery,imageryAttribution,1);
  if(type==='hybrid'){
   add('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}','',2);
   add('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}','Esri, HERE, Garmin, © OpenStreetMap közreműködők',3);
  }
 }else{
  add('https://tile.openstreetmap.org/{z}/{x}/{y}.png',osmAttribution,1);
  if(type==='rail')add('https://tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png','Stílus: <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC BY-SA 2.0</a> <a href="https://www.openrailwaymap.org/">OpenRailwayMap</a>',2);
 }
};
window.setMapType('standard');
const markers=L.layerGroup().addTo(map),routes=L.layerGroup().addTo(map);let vehicles=[],routeKey='',routeMode=false,routePoints=[],fittedVehicleIds='';
// Cluster in screen space, so every country-scale target remains independently tappable.
function draw(){
 markers.clearLayers();
 const visible=vehicles.filter(v=>map.getBounds().pad(.2).contains([v.lat,v.lon]));
 const groups=new Map(),zoom=map.getZoom();
 visible.forEach(v=>{const point=map.latLngToContainerPoint([v.lat,v.lon]);const key=routeMode?v.id:Math.floor(point.x/64)+','+Math.floor(point.y/64);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(v)});
 groups.forEach(group=>{
  const lat=group.reduce((s,v)=>s+v.lat,0)/group.length,lon=group.reduce((s,v)=>s+v.lon,0)/group.length;
  const hit=document.createElement('div');hit.className='hit';
  if(group.length>1 && !routeMode){
   const label=document.createElement('div');label.className='cluster';label.textContent=group.length;hit.append(label);
   L.marker([lat,lon],{icon:L.divIcon({html:hit,iconSize:[48,48],iconAnchor:[24,24],className:''}),title:group.length+' jármű · nagyítás',keyboard:true}).addTo(markers).on('click',()=>map.fitBounds(group.map(v=>[v.lat,v.lon]),{padding:[48,48],maxZoom:Math.min(19,zoom+3)}));
  }else{
   const v=group[0],label=document.createElement('div');label.className='vehicle compact';
   const color=/^[0-9a-f]{6}$/i.test((v.color||'').replace('#',''))?(v.color||'').replace('#',''):'2864d9';
   label.style.backgroundColor='#'+color;
   const rgb=[0,2,4].map(i=>parseInt(color.slice(i,i+2),16)/255).map(c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4);
   label.style.color=(rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722)>.179?'#000':'#fff';
   if(typeof v.heading==='number' && Number.isFinite(v.heading) && v.heading>=0 && v.heading<=360){
    label.classList.add('directed');
    const arrow=document.createElementNS('http://www.w3.org/2000/svg','svg');arrow.classList.add('heading');arrow.setAttribute('viewBox','-24 -24 48 48');arrow.setAttribute('aria-hidden','true');
    const outline=document.createElementNS(arrow.namespaceURI,'path');outline.setAttribute('d','M-6 -13.75 0 -22 6 -13.75 A15 15 0 1 1 -6 -13.75Z');outline.setAttribute('fill','#'+color);outline.setAttribute('stroke','#fff');outline.setAttribute('stroke-width','2');outline.setAttribute('stroke-linejoin','round');
    arrow.append(outline);arrow.style.transform='rotate('+v.heading+'deg)';label.append(arrow);
   }
   const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('fill','currentColor');svg.setAttribute('aria-hidden','true');
   const path=document.createElementNS(svg.namespaceURI,'path');
   path.setAttribute('d',['COACH','BUS','RAIL_REPLACEMENT_BUS'].includes(v.mode)?'M4 16c0 .88.39 1.67 1 2.22V20h2v-2h10v2h2v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4S4 2.5 4 6v10zm3 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm10 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM6 6h12v5H6z':v.mode==='TRAM'||v.mode==='TRAMTRAIN'?'M19 16V6c0-2-2-2.5-5-2.7L15 2h3V1H6v1h7l-1 1.2C8 3.2 5 3.5 5 6v10c0 1.5 1 2.7 2.3 3.2L6 21v1h2l2-2h4l2 2h2v-1l-1.3-1.8C18 18.7 19 17.5 19 16zM7 6h10v6H7zm1.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm7 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z':'M12 2C8 2 4 2.5 4 6v10c0 1.93 1.57 3.5 3.5 3.5L6 21v1h2l2-2h4l2 2h2v-1l-1.5-1.5c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-3.58-4-8-4zM6 6h5v5H6zm7 0h5v5h-5zM8.5 17a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm7 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z');
   svg.append(path);label.append(svg);hit.append(label);
   const marker=L.marker([v.lat,v.lon],{icon:L.divIcon({html:hit,iconSize:[48,48],iconAnchor:[24,24],className:''}),keyboard:true}).addTo(markers);
   marker.getElement().setAttribute('aria-label',v.type+' '+v.name+' '+v.headsign);marker.on('click',()=>NativeMap.selectVehicle(v.id));
  }

}
// Android WebView can initially resolve percentage/vh heights to zero while its
// Compose parent is being measured. Use the measured visual viewport explicitly.
window.resizeMap=()=>{const h=Math.max(1,innerHeight),w=Math.max(1,innerWidth);document.documentElement.style.height=h+'px';document.body.style.height=h+'px';const el=document.getElementById('map');el.style.height=h+'px';el.style.width=w+'px';map.invalidateSize({pan:false});draw()};
window.addEventListener('resize',window.resizeMap);
window.setRouteMode=enabled=>{routeMode=enabled};
window.updateVehicles=v=>{vehicles=v;window.resizeMap();
 const ids=v.map(item=>item.id).sort().join('|');
 if(routeMode&&routePoints.length&&ids&&ids!==fittedVehicleIds){map.fitBounds([...routePoints,...v.map(item=>[item.lat,item.lon])],{padding:[50,60]});fittedVehicleIds=ids}
};map.on('moveend',draw);
let bottomInset=0;window.setBottomInset=px=>{bottomInset=px;document.documentElement.style.setProperty('--bottom-inset',px+'px');document.getElementById('status').style.bottom=(px+48)+'px';reportLocation()};
// The WebView owns its backdrop so Compose never has to record live map tiles.
const statusbarFeather=document.createElement('div');statusbarFeather.id='statusbar-feather';statusbarFeather.setAttribute('aria-hidden','true');document.body.append(statusbarFeather);
let topInset=0;window.setTopInset=(px,color,blur)=>{topInset=px;const style=document.documentElement.style;style.setProperty('--top-inset',px+'px');style.setProperty('--top-feather-height',(px>0?px+24:0)+'px');style.setProperty('--feather-rgb',[(color>>>16)&255,(color>>>8)&255,color&255].join(','));style.setProperty('--top-feather-blur',blur?'blur(18px)':'none');reportLocation()};
window.centerOn=(lat,lon)=>{map.setView([lat,lon],12)};
let userLocation=null,userDot=null;
function reportLocation(){const p=userLocation&&map.latLngToContainerPoint(userLocation),size=map.getSize();if(window.NativeMap) NativeMap.locationInView(!!p&&p.x>=8&&p.x<=size.x-8&&p.y>=topInset+8&&p.y<=size.y-bottomInset-32)}
window.updateLocation=(lat,lon,recenter)=>{
 userLocation=L.latLng(lat,lon);
 if(!userDot) userDot=L.circleMarker(userLocation,{radius:8,color:'#fff',weight:3,fillColor:'#2864d9',fillOpacity:1,interactive:false}).addTo(map);
 else userDot.setLatLng(userLocation);
 if(recenter) map.setView(userLocation,14);
 reportLocation();
};
map.on('moveend resize',reportLocation);
function decode(encoded){let i=0,lat=0,lng=0,points=[];while(i<encoded.length){let coords=[];for(let c=0;c<2;c++){let shift=0,result=0,b;do{b=encoded.charCodeAt(i++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32 && i<encoded.length);coords.push(result&1?~(result>>1):result>>1)}lat+=coords[0];lng+=coords[1];points.push([lat/1e5,lng/1e5])}return points}
window.updateRoute=legs=>{window.resizeMap();const key=JSON.stringify(legs);if(key===routeKey)return;routeKey=key;routes.clearLayers();const points=[];legs.forEach(leg=>{const hex=(leg.color||'').replace(/^#/,'');const color=/^[0-9a-f]{6}$/i.test(hex)?'#'+hex:'#4e6581';const line=leg.geometry?decode(leg.geometry):[[leg.from.lat,leg.from.lon],[leg.to.lat,leg.to.lon]];if(line.length){L.polyline(line,{color,weight:5,opacity:.85,dashArray:leg.walking?'5 9':null}).addTo(routes);points.push(...line)};[leg.from,leg.to].forEach(s=>L.circleMarker([s.lat,s.lon],{radius:6,color,fillColor:'white',fillOpacity:1,weight:3}).bindTooltip(s.name).addTo(routes))});routePoints=points;if(points.length){const positions=routeMode?vehicles.map(v=>[v.lat,v.lon]):[];map.fitBounds([...points,...positions],{padding:[50,60]});if(positions.length)fittedVehicleIds=vehicles.map(v=>v.id).sort().join('|')}};
requestAnimationFrame(window.resizeMap);
</script></body></html>
