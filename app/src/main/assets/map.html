 draw();
}
window.setVehicleMotionEnabled=enabled=>{vehicleMotionEnabled=enabled;if(!enabled)finishVehicleMotion()};
reducedVehicleMotion.addEventListener('change',()=>{if(reducedVehicleMotion.matches)finishVehicleMotion()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)finishVehicleMotion()});
window.updateVehiclePaths=items=>{
 for(const [id,coordinates] of Object.entries(items)){
  const path=vehiclePath(coordinates);if(path)vehiclePaths.set(id,path);
 }
 while(vehiclePaths.size>256)vehiclePaths.delete(vehiclePaths.keys().next().value);
 requestVisibleVehiclePaths();
};
function requestVisibleVehiclePaths(){
 if(!window.NativeMap?.requestVehiclePaths)return;
 // Count clusters need no trip shapes. Wait until individual vehicles are
 // revealed, keeping a country-wide view from downloading the entire network.
 const ids=vehicleGroups.filter(({group})=>group.length===1).map(({group})=>group[0].id).filter(id=>!vehiclePaths.has(id)&&!requestedPaths.has(id)).slice(0,24);
 if(ids.length){ids.forEach(id=>requestedPaths.add(id));NativeMap.requestVehiclePaths(JSON.stringify(ids))}
}
function animateVehicles(now){
 vehicleFrame=0;
 vehicleMoves.forEach((move,id)=>{
  const t=Math.min(1,(now-move.time)/1000),eased=1-Math.pow(1-t,3);
  Object.assign(move.vehicle,vehiclePointAt(move.path,move.start+(move.end-move.start)*eased));
  if(t===1)vehicleMoves.delete(id);
 });
 vehicleGroups.forEach(({marker,group})=>marker.setLatLng([group.reduce((s,v)=>s+v.lat,0)/group.length,group.reduce((s,v)=>s+v.lon,0)/group.length]));
 if(vehicleMoves.size)vehicleFrame=requestAnimationFrame(animateVehicles);else draw();
}
// Cluster in screen space, so every country-scale target remains independently tappable.
function draw(){
 markers.clearLayers();vehicleGroups=[];
 const visible=vehicles.filter(v=>map.getBounds().pad(.2).contains([v.lat,v.lon]));
 const groups=new Map(),zoom=map.getZoom();
 visible.forEach(v=>{const point=map.latLngToContainerPoint([v.lat,v.lon]);const key=routeMode?v.id:Math.floor(point.x/64)+','+Math.floor(point.y/64);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(v)});
 const displayGroups=Array.from(groups.values()).flatMap(group=>group.length<3?group.map(v=>[v]):[group]);
 displayGroups.forEach(group=>{
  const lat=group.reduce((s,v)=>s+v.lat,0)/group.length,lon=group.reduce((s,v)=>s+v.lon,0)/group.length;
  const hit=document.createElement('div');hit.className='hit';
  if(group.length>=3 && !routeMode){
   const label=document.createElement('div');label.className='cluster';label.textContent=group.length;hit.append(label);
   const marker=L.marker([lat,lon],{icon:L.divIcon({html:hit,iconSize:[48,48],iconAnchor:[24,24],className:''}),title:group.length+' jármű · nagyítás',keyboard:true}).addTo(markers);
   vehicleGroups.push({marker,group});
   bindMapActivation(marker,()=>map.fitBounds(group.map(v=>[v.lat,v.lon]),{padding:[48,48],maxZoom:Math.min(19,zoom+3)}));
  }else{
   const v=group[0],label=document.createElement('div');label.className='vehicle compact';
   const color=Object.hasOwn(vehicleColors,v.mode)?vehicleColors[v.mode].replace('#',''):'000000';
   label.style.backgroundColor='#'+color;
   const rgb=[0,2,4].map(i=>parseInt(color.slice(i,i+2),16)/255).map(c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4);
   label.style.color=(rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722)>.179?'#000':'#fff';
   const artwork=document.createElementNS('http://www.w3.org/2000/svg','svg');artwork.classList.add('marker-artwork');artwork.setAttribute('viewBox','-24 -24 48 48');artwork.setAttribute('aria-hidden','true');
   if(typeof v.heading==='number' && Number.isFinite(v.heading) && v.heading>=0 && v.heading<=360){
    const arrow=artwork;
    const outline=document.createElementNS(arrow.namespaceURI,'path');outline.setAttribute('d','M-6 -13.75 0 -22 6 -13.75 A15 15 0 1 1 -6 -13.75Z');outline.setAttribute('fill','#'+color);outline.setAttribute('stroke','#fff');outline.setAttribute('stroke-width','2');outline.setAttribute('stroke-linejoin','round');
    outline.setAttribute('transform','rotate('+v.heading+')');arrow.append(outline);
   }else{
    const circle=document.createElementNS(artwork.namespaceURI,'circle');circle.setAttribute('r','15');circle.setAttribute('fill','#'+color);circle.setAttribute('stroke','#fff');circle.setAttribute('stroke-width','2');artwork.append(circle);
   }
   const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('fill','currentColor');svg.setAttribute('aria-hidden','true');
   const path=document.createElementNS(svg.namespaceURI,'path');
   path.setAttribute('d',['COACH','BUS','RAIL_REPLACEMENT_BUS'].includes(v.mode)?'M4 16c0 .88.39 1.67 1 2.22V20h2v-2h10v2h2v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4S4 2.5 4 6v10zm3 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm10 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM6 6h12v5H6z':v.mode==='TRAM'||v.mode==='TRAMTRAIN'?'M19 16V6c0-2-2-2.5-5-2.7L15 2h3V1H6v1h7l-1 1.2C8 3.2 5 3.5 5 6v10c0 1.5 1 2.7 2.3 3.2L6 21v1h2l2-2h4l2 2h2v-1l-1.3-1.8C18 18.7 19 17.5 19 16zM7 6h10v6H7zm1.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm7 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z':'M12 2C8 2 4 2.5 4 6v10c0 1.93 1.57 3.5 3.5 3.5L6 21v1h2l2-2h4l2 2h2v-1l-1.5-1.5c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-3.58-4-8-4zM6 6h5v5H6zm7 0h5v5h-5zM8.5 17a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm7 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z');
   if(Object.hasOwn(vehicleIconUrls,v.mode)){
    const image=document.createElementNS(artwork.namespaceURI,'image');image.setAttribute('href',vehicleIconUrls[v.mode]);image.setAttribute('x','-14');image.setAttribute('y','-14');image.setAttribute('width','28');image.setAttribute('height','28');
    artwork.append(image);
   }else{
    svg.setAttribute('x','-10');svg.setAttribute('y','-10');svg.setAttribute('width','20');svg.setAttribute('height','20');svg.append(path);artwork.append(svg);
   }
   label.append(artwork);hit.append(label);
   const marker=L.marker([v.lat,v.lon],{icon:L.divIcon({html:hit,iconSize:[48,48],iconAnchor:[24,24],className:''}),keyboard:true}).addTo(markers);
   vehicleGroups.push({marker,group});
   marker.getElement().setAttribute('aria-label',v.type+' '+v.name+' '+v.headsign);bindMapActivation(marker,()=>NativeMap.selectVehicle(v.id));
  }
 });
 if(!tileFailed){status.textContent='';status.style.display='none'}
 requestVisibleVehiclePaths();
}
// Android WebView can initially resolve percentage/vh heights to zero while its
// Compose parent is being measured. Use the measured visual viewport explicitly.
window.resizeMap=()=>{const h=Math.max(1,innerHeight),w=Math.max(1,innerWidth);document.documentElement.style.height=h+'px';document.body.style.height=h+'px';const el=document.getElementById('map');el.style.height=h+'px';el.style.width=w+'px';map.invalidateSize({pan:false});draw()};
window.addEventListener('resize',window.resizeMap);
window.setRouteMode=enabled=>{routeMode=enabled};
window.updateVehicles=v=>{
 cancelAnimationFrame(vehicleFrame);vehicleFrame=0;
 const previous=new Map(vehicles.map(item=>[item.id,item]));vehicleMoves.clear();requestedPaths.clear();
 const now=performance.now(),bounds=map.getBounds().pad(.2);
 vehicles=v.map(target=>{
  const from=previous.get(target.id),path=vehiclePaths.get(target.id);
  const movement=from&&vehicleMotionEnabled&&!reducedVehicleMotion.matches&&!document.hidden&&bounds.contains([from.lat,from.lon])?vehicleMovement(path,from,target):null;
  const vehicle={...target};
  if(movement){Object.assign(vehicle,vehiclePointAt(path,movement.start));vehicleMoves.set(target.id,{...movement,vehicle,target,time:now})}
  return vehicle;
 });
 window.resizeMap();
 if(vehicleMoves.size)vehicleFrame=requestAnimationFrame(animateVehicles);
 const ids=v.map(item=>item.id).sort().join('|');
 if(routeMode&&routePoints.length&&ids&&ids!==fittedVehicleIds){map.fitBounds([...routePoints,...v.map(item=>[item.lat,item.lon])],{padding:[50,60]});fittedVehicleIds=ids}
};map.on('moveend',draw);
let bottomInset=0;window.setBottomInset=px=>{bottomInset=px;document.documentElement.style.setProperty('--bottom-inset',px+'px');document.getElementById('status').style.bottom=(px+48)+'px';reportLocation()};
// The WebView owns its backdrop so Compose never has to record live map tiles.
const statusbarFeather=document.createElement('div');statusbarFeather.id='statusbar-feather';statusbarFeather.setAttribute('aria-hidden','true');document.body.append(statusbarFeather);
window.setAppTheme=(ground,surface,ink,action)=>{
 const css=document.documentElement.style;
 const hex=value=>'#'+(value>>>0).toString(16).padStart(8,'0').slice(-6);
 for(const [role,value] of Object.entries({ground,surface,ink,action}))css.setProperty('--app-'+role,hex(value));
};
let topInset=0;window.setTopInset=(px,color,blur)=>{topInset=px;const style=document.documentElement.style;style.setProperty('--top-inset',px+'px');style.setProperty('--top-feather-height',(px>0?px+24:0)+'px');style.setProperty('--feather-rgb',[(color>>>16)&255,(color>>>8)&255,color&255].join(','));style.setProperty('--top-feather-blur',blur?'blur(18px)':'none');reportLocation()};
window.centerOn=(lat,lon)=>{map.setView([lat,lon],12)};
let userLocation=null,userDot=null;
function reportLocation(){const p=userLocation&&map.latLngToContainerPoint(userLocation),size=map.getSize();if(window.NativeMap) NativeMap.locationInView(!!p&&p.x>=8&&p.x<=size.x-8&&p.y>=topInset+8&&p.y<=size.y-bottomInset-32)}
window.updateLocation=(lat,lon,recenter)=>{
 userLocation=L.latLng(lat,lon);
 if(!userDot) userDot=L.circleMarker(userLocation,{radius:8,color:'#fff',weight:3,fillColor:'#2864d9',fillOpacity:1,interactive:false}).addTo(map);
 else userDot.setLatLng(userLocation);
 if(recenter) map.setView(userLocation,14);
 reportLocation();
};
map.on('moveend resize',reportLocation);
function decode(encoded){let i=0,lat=0,lng=0,points=[];while(i<encoded.length){let coords=[];for(let c=0;c<2;c++){let shift=0,result=0,b;do{b=encoded.charCodeAt(i++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32 && i<encoded.length);coords.push(result&1?~(result>>1):result>>1)}lat+=coords[0];lng+=coords[1];points.push([lat/1e5,lng/1e5])}return points}
const destinationAlerts=L.layerGroup().addTo(map);
window.updateDestinationAlert=area=>{
 destinationAlerts.clearLayers();
 if(!area)return;
 L.circle([area.lat,area.lon],{radius:area.radius,color:area.color,weight:2,fillColor:area.color,fillOpacity:.12,interactive:false}).addTo(destinationAlerts);
 if(area.guard)L.circle([area.guard.lat,area.guard.lon],{radius:area.guard.radius,color:area.color,weight:2,dashArray:'4 5',fillColor:area.color,fillOpacity:.06,interactive:false}).addTo(destinationAlerts);
};
window.updateRoute=legs=>{window.resizeMap();const key=JSON.stringify(legs);if(key===routeKey)return;routeKey=key;routes.clearLayers();const points=[];legs.forEach(leg=>{const hex=(leg.color||'').replace(/^#/,'');const color=/^[0-9a-f]{6}$/i.test(hex)?'#'+hex:'#4e6581';const line=leg.geometry?decode(leg.geometry):[[leg.from.lat,leg.from.lon],[leg.to.lat,leg.to.lon]];if(line.length){L.polyline(line,{color,weight:5,opacity:.85,dashArray:leg.walking?'5 9':null}).addTo(routes);points.push(...line)};[leg.from,leg.to].forEach(s=>L.circleMarker([s.lat,s.lon],{radius:6,color,fillColor:'white',fillOpacity:1,weight:3}).addTo(routes))});routePoints=points;if(points.length){const positions=routeMode?vehicles.map(v=>[v.lat,v.lon]):[];map.fitBounds([...points,...positions],{padding:[50,60]});if(positions.length)fittedVehicleIds=vehicles.map(v=>v.id).sort().join('|')}};
requestAnimationFrame(window.resizeMap);
</script></body></html>
