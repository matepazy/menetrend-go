<!doctype html><html lang="hu"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://tile.openstreetmap.org data:; connect-src 'none';">
<style>/* LEAFLET_CSS */
html,body,#map{height:100%;margin:0;background:#e5edf3;font-family:Roboto,Arial,sans-serif}.leaflet-control-zoom{border-radius:24px!important;overflow:hidden;border:0!important;box-shadow:0 3px 16px #1233!important}.leaflet-control-zoom a{width:48px!important;height:48px!important;line-height:48px!important}.hit{width:48px;height:48px;display:flex;align-items:center;justify-content:center}.cluster{background:#244c86;color:white;border:3px solid white;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font:bold 13px Roboto,Arial;box-shadow:0 2px 8px #1234}.vehicle.compact{width:18px;height:18px;min-width:0;padding:0;border-radius:50%}.vehicle{flex-shrink:0;width:max-content;background:#2864d9;color:white;border:2px solid white;border-radius:22px;padding:6px 10px;white-space:nowrap;font:bold 13px Roboto,Arial;box-shadow:0 2px 8px #1234;min-width:20px;text-align:center}.bus{background:#0d687a}#status{position:absolute;z-index:1000;bottom:36px;left:12px;right:78px;background:#f8fbfff2;color:#112d43;border-radius:18px;padding:10px;font-size:12px;display:none}.leaflet-control-attribution{font-size:10px!important;max-width:240px;white-space:normal;margin-right:18px!important;margin-bottom:16px!important;border-radius:12px;padding:4px 8px!important}.leaflet-tooltip{border-radius:16px;padding:10px}
</style></head><body><div id="map" role="application" aria-label="Járművek térképe"></div><div id="status"></div><script>/* LEAFLET_JS */</script><script>
const map=L.map('map',{zoomControl:true}).setView([47.17,19.5],7);
const status=document.getElementById('status');let tileFailed=false;
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> közreműködők'}).on('tileerror',()=>{tileFailed=true;status.textContent='A térképcsempék nem tölthetők be. Ellenőrizd az internetkapcsolatot.';status.style.display='block'}).addTo(map);
const markers=L.layerGroup().addTo(map),routes=L.layerGroup().addTo(map);let vehicles=[],routeKey='';
// Cluster in screen space, so every country-scale target remains independently tappable.
function draw(){
 markers.clearLayers();
 const visible=vehicles.filter(v=>map.getBounds().pad(.2).contains([v.lat,v.lon]));
 const groups=new Map(),zoom=map.getZoom();
 visible.forEach(v=>{const point=map.latLngToContainerPoint([v.lat,v.lon]);const key=Math.floor(point.x/64)+','+Math.floor(point.y/64);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(v)});
 groups.forEach(group=>{
  const lat=group.reduce((s,v)=>s+v.lat,0)/group.length,lon=group.reduce((s,v)=>s+v.lon,0)/group.length;
  const hit=document.createElement('div');hit.className='hit';
  if(group.length>1){
   const label=document.createElement('div');label.className='cluster';label.textContent=group.length;hit.append(label);
   L.marker([lat,lon],{icon:L.divIcon({html:hit,iconSize:[48,48],iconAnchor:[24,24],className:''}),title:group.length+' jármű · nagyítás',keyboard:true}).addTo(markers).on('click',()=>map.fitBounds(group.map(v=>[v.lat,v.lon]),{padding:[48,48],maxZoom:Math.min(19,zoom+3)}));
  }else{
   const v=group[0],label=document.createElement('div');label.className='vehicle '+(v.mode==='COACH'?'bus ':'')+(zoom<12?'compact':'');label.textContent=zoom<12?'':v.name.slice(0,12);hit.append(label);
   const marker=L.marker([v.lat,v.lon],{icon:L.divIcon({html:hit,iconSize:[48,48],iconAnchor:[24,24],className:''}),keyboard:true,title:v.name+' '+v.headsign}).addTo(markers);
   const tip=document.createElement('span');tip.textContent=v.name+' · '+v.headsign;marker.bindTooltip(tip);marker.on('click',()=>NativeMap.selectVehicle(v.id));
  }
 });
 if(!tileFailed){status.textContent='';status.style.display='none'}
}
// Android WebView can initially resolve percentage/vh heights to zero while its
// Compose parent is being measured. Use the measured visual viewport explicitly.
window.resizeMap=()=>{const h=Math.max(1,innerHeight),w=Math.max(1,innerWidth);document.documentElement.style.height=h+'px';document.body.style.height=h+'px';const el=document.getElementById('map');el.style.height=h+'px';el.style.width=w+'px';map.invalidateSize({pan:false});draw()};
window.addEventListener('resize',window.resizeMap);
window.updateVehicles=v=>{vehicles=v;window.resizeMap()};map.on('moveend',draw);
window.centerOn=(lat,lon)=>{map.setView([lat,lon],12)};
function decode(encoded){let i=0,lat=0,lng=0,points=[];while(i<encoded.length){let coords=[];for(let c=0;c<2;c++){let shift=0,result=0,b;do{b=encoded.charCodeAt(i++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32 && i<encoded.length);coords.push(result&1?~(result>>1):result>>1)}lat+=coords[0];lng+=coords[1];points.push([lat/1e5,lng/1e5])}return points}
window.updateRoute=legs=>{window.resizeMap();const key=JSON.stringify(legs);if(key===routeKey)return;routeKey=key;routes.clearLayers();const points=[];legs.forEach(leg=>{const line=leg.geometry?decode(leg.geometry):[[leg.from.lat,leg.from.lon],[leg.to.lat,leg.to.lon]];if(line.length){L.polyline(line,{color:'#2864d9',weight:5,opacity:.85}).addTo(routes);points.push(...line)};[leg.from,leg.to].forEach(s=>L.circleMarker([s.lat,s.lon],{radius:6,color:'#2864d9',fillColor:'white',fillOpacity:1,weight:3}).bindTooltip(s.name).addTo(routes))});if(points.length)map.fitBounds(points,{padding:[30,40]})};
requestAnimationFrame(window.resizeMap);
</script></body></html>
